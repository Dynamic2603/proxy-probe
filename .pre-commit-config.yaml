repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run python -m ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run python -m mypy proxy_probe tests
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv run python -m vulture
        language: system
        types: [python]
        pass_filenames: false
