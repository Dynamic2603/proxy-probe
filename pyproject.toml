[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proxy-probe"
version = "0.1.0"
description = "Universal target-driven proxy prober and manager"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "inquirerpy>=0.3.4",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
proxy-probe = "proxy_probe.cli:main"
pxp = "proxy_probe.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.0",
    "ruff>=0.16.0",
    "types-tqdm>=4.70.0.20260906",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM115"]

[tool.vulture]
exclude = [".venv"]
ignore_names = ["group_id", "row_factory"]
min_confidence = 60
paths = ["proxy_probe", "tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true




