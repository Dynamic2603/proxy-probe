[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proxy-probe"
version = "0.1.0"
description = "Universal target-driven proxy prober and manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inquirerpy>=0.3.4",
    "rich>=15.0.0",
]

[project.scripts]
proxy-probe = "proxy_probe.cli:main"
pxp = "proxy_probe.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM115"]


